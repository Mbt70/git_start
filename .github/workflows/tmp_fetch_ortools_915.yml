name: tmp-fetch-ortools-9.15

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Download exact OR-Tools wheel
        run: |
          set -euxo pipefail
          mkdir -p artifact
          python -m pip download --only-binary=:all: --no-deps --dest artifact 'ortools==9.15.6755'
          sha256sum artifact/* | tee artifact/SHA256SUMS.txt
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ortools-9.15.6755-cp313-linux-wheel
          path: artifact/
          if-no-files-found: error
          retention-days: 1
